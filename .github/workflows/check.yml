name: JavaScript syntax
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked JavaScript
        run: git ls-files -z '*.js' | xargs -0 -r -n1 node --check
